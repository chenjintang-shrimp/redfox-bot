[project]
name = "redfox-bot"
version = "0.1.0"
description = "A highly-customized bot for osu! private servers"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "aiocache>=0.12.3",
    "aiosqlite>=0.22.1",
    "discord>=2.3.2",
    "fastapi>=0.128.0",
    "httpx>=0.28.1",
    "jinja2>=3.1.6",
    "loguru>=0.7.3",
    "nonebot-adapter-onebot>=2.4.6",
    "nonebot-plugin-alconna>=0.60.4",
    "nonebot2[fastapi]>=2.4.4",
    "playwright>=1.58.0",
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0.3",
    "sqlmodel>=0.0.31",
    "uvicorn>=0.40.0",
]

[project.scripts]
discord-bot = "frontend.discord.main:main"
qq-bot = "frontend.qq.main:main"

[tool.uv]
package = true

[tool.setuptools]
packages = ["frontend", "backend", "utils", "renderer", "minifilters"]

[dependency-groups]
dev = [
    "pyright>=1.1.408",
    "ruff>=0.14.14",
]

[tool.pyright]
# 装饰器会改变函数签名，导致调用检查误报
# 使用 # type: ignore 注释来抑制特定错误
reportCallIssue = "warning"
