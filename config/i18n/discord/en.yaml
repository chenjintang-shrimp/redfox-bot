# Discord Platform - English i18n

# User module
user:
  # Info command - text output
  info_text: |
    User info for {username}:
    id: {id}
    playmode: {playmode}
    pp: {pp}
    global rank: #{global_rank}

  # Bind command responses
  bind_success: "Successfully bound to osu! user: {username}"
  bind_exists: "You have already bound an osu! account. Please unbind first to change."
  bind_user_not_found: "User not found: {username}"
  bind_failed: "Binding failed: {error}"

  # Unbind command responses
  unbind_success: "Successfully unbound your osu! account"
  unbind_not_bound: "You have not bound an osu! account yet"
  unbind_failed: "Unbinding failed: {error}"

  # General user errors
  not_bound: "Please bind your osu! account first using `/bind <username>`, or specify a username"
  not_found: "User not found: {username}"
  query_failed: "Failed to query user: {error}"

# Scores module
scores:
  # Score on beatmap
  beatmap_id_required: "Please provide a beatmap ID. Usage: `/ss <beatmap_id>`"
  beatmap_id_invalid: "Beatmap ID must be a number"
  no_scores_on_beatmap: "{username} has no scores on this beatmap"

  # Best scores
  no_best_scores: "{username} has no best scores"
  best_scores_title: "{username}'s Best Scores"

  # Recent scores
  no_recent_scores: "{username} has no recent plays"
  recent_scores_title: "{username}'s Recent Plays"

  # Score query errors
  query_failed: "Failed to query scores: {error}"

# Beatmap module
beatmap:
  not_found: "Beatmap not found: {beatmap_id}"
  info_failed: "Failed to get beatmap info: {error}"

# Today BP module
today_bp:
  title: "{username}'s Today's Best Scores (24h)"
  empty: "{username} has no new best scores in the last 24 hours"

# Common errors
errors:
  render_failed: "Failed to generate image. Please try again later."
  unknown_error: "An unknown error occurred"
