QQ_BIND_EXIST_TEMPLATE: 你已经绑定过 osu! 账号了，请先解绑
QQ_BIND_USER_NOT_FOUND_TEMPLATE: 找不到用户: {{ username }}
QQ_BIND_FAILED_TEMPLATE: 绑定失败，请稍后重试
QQ_UNBIND_SUCCESS_TEMPLATE: 解绑成功
QQ_UNBIND_NOT_BOUND_TEMPLATE: 你还没有绑定 osu! 账号
QQ_UNBIND_FAILED_TEMPLATE: 解绑失败，请稍后重试
QQ_QUERY_FAILED_TEMPLATE: 查询失败，请稍后重试
QQ_QUERY_ERROR_TEMPLATE: 查询失败: {{ error_msg }}
