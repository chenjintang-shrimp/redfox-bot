# ============================================
# 国际化文本配置
# 结构: 功能KEY -> 语言代码 -> 文本模板
# 语言代码: en (英文), zh (中文), 可扩展 ja (日语) 等
# ============================================

# --------------------------------------------
# 用户相关
# --------------------------------------------
USER_INFO_TEMPLATE:
  en: |
    User info for {{ username }}:
    id: {{ id }}
    playmode: {{ playmode }}
    pp: {{ (statistics | default({})).pp | default(0) }}
    global rank: #{{ (statistics | default({})).global_rank | default('N/A') }}
  zh: |
    用户 {{ username }} 的信息：
    ID: {{ id }}
    游戏模式: {{ playmode }}
    PP: {{ (statistics | default({})).pp | default(0) }}
    全球排名: #{{ (statistics | default({})).global_rank | default('N/A') }}

USER_QUERY_ERROR_TEMPLATE:
  en: |
    Error querying user:
    {{ error_msg }}
  zh: |
    查询用户失败：
    {{ error_msg }}

USER_BIND_EXISTING_TEMPLATE:
  en: |
    You have already bound to osu user {{ username }}
    If you want to change it, please unbind first.
  zh: |
    你已经绑定了 osu 用户 {{ username }}
    如需更换，请先解绑。

USER_BIND_SUCCESS_TEMPLATE:
  en: Successfully bound to osu user {{ username }}
  zh: 成功绑定 osu 用户 {{ username }}

USER_UNBIND_SUCCESS_TEMPLATE:
  en: Successfully unbound your osu account from our bot.
  zh: 成功解绑 osu 账号。

USER_NOT_BOUND_TEMPLATE:
  en: |
    {{ user }} did NOT bind an osu account to our bot.
  zh: |
    {{ user }} 没有绑定 osu 账号。

USER_NOT_FOUND_TEMPLATE:
  en: User not found! Please check the username.
  zh: 找不到用户！请检查用户名。

# --------------------------------------------
# 渲染器错误
# --------------------------------------------
RENDERER_ERROR_TEMPLATE:
  en: |
    Error occurred in renderer:
    {{ error_msg }}
  zh: |
    渲染器发生错误：
    {{ error_msg }}

# --------------------------------------------
# 成绩相关
# --------------------------------------------
SCORE_NOT_FOUND_TEMPLATE:
  en: User {{ username }} did not play beatmap {{ beatmap_id }}.
  zh: 用户 {{ username }} 没有玩过谱面 {{ beatmap_id }}。

SCORE_QUERY_ERROR_TEMPLATE:
  en: |
    Error querying score:
    {{ error_msg }}
  zh: |
    查询成绩失败：
    {{ error_msg }}

SCORES_LIST_HEADER_TEMPLATE:
  en: |
    📊 **{{ username }}**'s scores on **{{ beatmap_title }}** [{{ beatmap_version }}]🎵 {{ beatmap_artist }} | ⭐ {{ "%.2f" | format(beatmap_stars) }}★ | 🎮 {{ beatmap_mode }}
    ━━━━━━━━━━━━━━━━━━━━━━
  zh: |
    📊 **{{ username }}** 在 **{{ beatmap_title }}** [{{ beatmap_version }}] 的成绩 🎵 {{ beatmap_artist }} | ⭐ {{ "%.2f" | format(beatmap_stars) }}★ | 🎮 {{ beatmap_mode }}
    ━━━━━━━━━━━━━━━━━━━━━━

SCORES_LIST_ITEM_TEMPLATE:
  en: |
    #{{ "%-2s" | format(index) }} │ {{ "%-6s" | format(rank) }} │ {{ "%10s" | format(total_score) }} │ {{ "%7s" | format(accuracy) }} │ {{ "%4s" | format(max_combo) }}x │ {{ "%7.2f" | format(pp) }}pp
          └─ 🎯 {{ mods }} │ 📅 {{ created_at }}
  zh: |
    #{{ "%-2s" | format(index) }} │ {{ "%-6s" | format(rank) }} │ {{ "%10s" | format(total_score) }} │ {{ "%7s" | format(accuracy) }} │ {{ "%4s" | format(max_combo) }}x │ {{ "%7.2f" | format(pp) }}pp
          └─ 🎯 {{ mods }} │ 📅 {{ created_at }}

SCORES_LIST_FOOTER_TEMPLATE:
  en: |
    ━━━━━━━━━━━━━━━━━━━━━━
    📄 Page {{ current_page }}/{{ total_pages }} | Total: {{ total_scores }} scores
  zh: |
    ━━━━━━━━━━━━━━━━━━━━━━
    📄 第 {{ current_page }}/{{ total_pages }} 页 | 共 {{ total_scores }} 个成绩

SCORES_LIST_EMPTY_TEMPLATE:
  en: 📭 **{{ username }}** has no scores on this beatmap.
  zh: 📭 **{{ username }}** 在这个谱面上没有成绩。

# --------------------------------------------
# 用户成绩列表
# --------------------------------------------
USER_SCORES_LIST_HEADER_TEMPLATE:
  en: |
    📊 **{{ username }}**'s {{ type }} scores
    ━━━━━━━━━━━━━━━━━━━━━━
  zh: |
    📊 **{{ username }}** 的 {{ type }} 成绩
    ━━━━━━━━━━━━━━━━━━━━━━

USER_SCORES_LIST_ITEM_TEMPLATE:
  en: |
    #{{ "%-2s" | format(index) }} │ {{ "%-6s" | format(rank) }} │ {{ "%7.2f" | format(pp) }}pp │ {{ "%7s" | format(accuracy) }}
          └─ 🎵 {{ beatmap_title }} [{{ beatmap_version }}]
          └─ {{ mods }} │ {{ created_at }}
  zh: |
    #{{ "%-2s" | format(index) }} │ {{ "%-6s" | format(rank) }} │ {{ "%7.2f" | format(pp) }}pp │ {{ "%7s" | format(accuracy) }}
          └─ 🎵 {{ beatmap_title }} [{{ beatmap_version }}]
          └─ {{ mods }} │ {{ created_at }}

USER_SCORE_SINGLE_TEMPLATE:
  en: |
    📊 **{{ username }}**'s {{ type }} score on **{{ beatmap_title }}** [{{ beatmap_version }}]
    🎵 {{ beatmap_artist }} | ⭐ {{ "%.2f" | format(beatmap_stars) }}★ | 🎮 {{ beatmap_mode }}
    ━━━━━━━━━━━━━━━━━━━━━━
    {{ rank_emoji }} **{{ rank }}** │ {{ pp }}pp │ {{ accuracy }}
    {{ mods }} │ x{{ max_combo }}/{{ max_combo_beatmap }}
    Score: {{ total_score }} │ {{ created_at }}

    🔗 [Beatmap]({{ beatmap_url }})
  zh: |
    📊 **{{ username }}** 在 **{{ beatmap_title }}** [{{ beatmap_version }}] 的 {{ type }} 成绩
    🎵 {{ beatmap_artist }} | ⭐ {{ "%.2f" | format(beatmap_stars) }}★ | 🎮 {{ beatmap_mode }}
    ━━━━━━━━━━━━━━━━━━━━━━
    {{ rank_emoji }} **{{ rank }}** │ {{ pp }}pp │ {{ accuracy }}
    {{ mods }} │ x{{ max_combo }}/{{ max_combo_beatmap }}
    分数: {{ total_score }} │ {{ created_at }}

    🔗 [谱面链接]({{ beatmap_url }})

USER_SCORES_EMPTY_TEMPLATE:
  en: 📭 **{{ username }}** has no {{ type }} scores.
  zh: 📭 **{{ username }}** 没有 {{ type }} 成绩。

# --------------------------------------------
# 评级 emoji (通用，不需要翻译)
# --------------------------------------------
RANK_EMOJIS:
  XH: 🏆 XH
  X: 🥇 X
  SH: ✨ SH
  S: ⭐ S
  A: 🟢 A
  B: 🔵 B
  C: 🟡 C
  D: 🔴 D
  F: 💀 F

# --------------------------------------------
# 谱面信息
# --------------------------------------------
BEATMAP_INFO_TEMPLATE:
  en: |
    🎵 **{{ title }}** [{{ version }}]
    👤 Artist: {{ artist }}
    ✍️ Creator: {{ creator }}
    ⭐ Stars: {{ "%.2f" | format(stars) }}★ | 🕒 Length: {{ length }}
    💿 Status: {{ status }} | 💓 BPM: {{ bpm }}
    📊 CS: {{ cs }} | AR: {{ ar }} | OD: {{ od }} | HP: {{ hp }}
    🔗 [Link]({{ url }})
  zh: |
    🎵 **{{ title }}** [{{ version }}]
    👤 艺术家: {{ artist }}
    ✍️ 谱师: {{ creator }}
    ⭐ 星级: {{ "%.2f" | format(stars) }}★ | 🕒 时长: {{ length }}
    💿 状态: {{ status }} | 💓 BPM: {{ bpm }}
    📊 CS: {{ cs }} | AR: {{ ar }} | OD: {{ od }} | HP: {{ hp }}
    🔗 [链接]({{ url }})

BEATMAP_NOT_FOUND_TEMPLATE:
  en: ❌ Beatmap **{{ beatmap_id }}** not found! Please check the beatmap ID.
  zh: ❌ 找不到谱面 **{{ beatmap_id }}**！请检查谱面ID是否正确。

# --------------------------------------------
# 今日BP
# --------------------------------------------
TODAY_BP_HEADER_TEMPLATE:
  en: |
    🌟 **{{ username }}**'s Today's Best Scores (24h)
    ━━━━━━━━━━━━━━━━━━━━━━
  zh: |
    🌟 **{{ username }}** 今日最佳成绩 (24小时)
    ━━━━━━━━━━━━━━━━━━━━━━

TODAY_BP_EMPTY_TEMPLATE:
  en: 📭 **{{ username }}** has no new best scores in the last 24 hours.
  zh: 📭 **{{ username }}** 在过去24小时内没有新的最佳成绩。

# --------------------------------------------
# 皮肤不可用
# --------------------------------------------
NO_SKIN_AVAILABLE_TEMPLATE:
  en: |
    ❌ No skin available: {{ skin_name }}/{{ template_name }}
    Please contact admin to add skin, or use other features.
  zh: |
    ❌ 没有可用皮肤: {{ skin_name }}/{{ template_name }}
    请联系管理员添加皮肤，或使用其他功能。

# --------------------------------------------
# 提示信息 (原 QQ Bot 提示，现在通用化)
# --------------------------------------------
USER_NOT_BIND_HINT:
  en: Please use `/bind <osu_username>` to bind your account first, or specify a username to query.
  zh: 请先使用 !bind <osu用户名> 绑定账号，或指定用户名查询

BIND_SUCCESS:
  en: "Successfully bound to osu! user: {{ username }}"
  zh: "成功绑定 osu! 用户: {{ username }}"

BIND_EXIST:
  en: You have already bound to an osu! account. Please unbind first.
  zh: 你已经绑定过 osu! 账号了，请先解绑

BIND_USER_NOT_FOUND:
  en: "User not found: {{ username }}"
  zh: "找不到用户: {{ username }}"

BIND_FAILED:
  en: Bind failed, please try again later.
  zh: 绑定失败，请稍后重试

UNBIND_SUCCESS:
  en: Unbind successful.
  zh: 解绑成功

UNBIND_NOT_BOUND:
  en: You have not bound an osu! account yet.
  zh: 你还没有绑定 osu! 账号

UNBIND_FAILED:
  en: Unbind failed, please try again later.
  zh: 解绑失败，请稍后重试

CONNECTION_FAILED:
  en: Server connection failed. Please try again later or check your network connection.
  zh: 服务器连接失败，请稍后重试或检查网络连接。

QUERY_FAILED:
  en: Query failed, please try again later.
  zh: 查询失败，请稍后重试

QUERY_ERROR:
  en: "Query failed: {{ error_msg }}"
  zh: "查询失败: {{ error_msg }}"

RENDER_FAILED:
  en: Failed to generate card, please try again later.
  zh: 生成卡片失败，请稍后重试

BEATMAP_ID_REQUIRED:
  en: "Please provide a beatmap ID. Format: /ss <beatmap_id>"
  zh: "请提供谱面ID，格式: !ss <beatmap_id>"

BEATMAP_ID_INVALID:
  en: Beatmap ID must be a number.
  zh: 谱面ID必须是数字

# --------------------------------------------
# 游戏模式设置
# --------------------------------------------
GAMEMODE_CURRENT:
  en: "Current default game mode: {{ gamemode }}"
  zh: "当前默认游戏模式: {{ gamemode }}"

GAMEMODE_NOT_SET:
  en: No default game mode set.
  zh: 未设置默认游戏模式

GAMEMODE_SET_SUCCESS:
  en: "Successfully set default game mode to: {{ gamemode }}"
  zh: "成功设置默认游戏模式为: {{ gamemode }}"

GAMEMODE_SET_FAILED_NOT_BOUND:
  en: "Please bind your osu! account first using `/bind <username>` or `!bind <username>`."
  zh: "请先使用 `/bind <用户名>` 或 `!bind <用户名>` 绑定 osu! 账号。"

GAMEMODE_INVALID:
  en: "Unknown game mode: {{ input }}. Available: {{ modes }}"
  zh: "未知游戏模式: {{ input }}。可用: {{ modes }}"

GAMEMODE_AVAILABLE:
  en: "Available game modes: {{ modes }}"
  zh: "可用游戏模式: {{ modes }}"
